name: cpu
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[test]"
      - run: python -m unittest discover -s tests -v
      - run: apitail demo --output work/demo
      - run: python scripts/reproduce_paper.py --output work/paper
      - run: python scripts/check_release.py --output work/check
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build
      - run: python -m venv wheel-env
      - run: wheel-env/bin/python -m pip install dist/*.whl
      - run: wheel-env/bin/apitail doctor
      - run: cd /tmp && ${{ github.workspace }}/wheel-env/bin/apitail demo --output apitail-demo
