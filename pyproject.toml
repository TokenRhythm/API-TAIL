[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "api-tail"
version = "0.1.1"
description = "Temperature-aligned likelihood tails for auditing model substitution in LLM APIs"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "TokenRhythm Technologies"}]
dependencies = ["numpy>=1.24,<3"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
baselines = ["scipy>=1.10,<2"]
score = ["torch>=2.6", "transformers>=5.5,<6", "accelerate>=1.0", "safetensors>=0.4"]
test = ["scipy>=1.10,<2"]
dev = ["build>=1.2"]

[project.scripts]
apitail = "apitail.cli:main"

[project.urls]
Repository = "https://github.com/TokenRhythm/API-TAIL"

[tool.setuptools.packages.find]
where = ["src"]
